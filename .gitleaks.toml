title = "vps-nook gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Non-secret template placeholders and README network values"
regexes = [
  '''replace-with-[A-Za-z0-9-]+''',
  '''ssh-ed25519 AAAA\.\.\. your-key-here''',
  '''203\.0\.113\.10''',
  '''\$2y\$10\$replace-with-bcrypt-hash-only''',
  '''<ansible_host>''',
  '''<admin_user>''',
  '''<ssh_port>''',
  '''10\.8\.0\.(0/24|[0-9]+)''',
  '''172\.20\.0\.(0/24|[0-9]+)''',
  '''127\.0\.0\.1''',
  '''51820''',
  '''51821''',
  '''2222''',
]
