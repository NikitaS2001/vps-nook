[pytest]
minversion = 9.1
testpaths = tests
addopts = --strict-markers --strict-config -ra --durations=15 --tb=short
junit_logging = no
junit_log_passing_tests = false
markers =
    quick: local contracts and native fixtures; no VMs
    qemu: services-mode installer VM including negative scenarios
    lifecycle: compatible baseline upgrade, rerun and encrypted restore
    remote: controller-managed SSH recovery and cutover in a VM
    release: local release contracts; never publish
