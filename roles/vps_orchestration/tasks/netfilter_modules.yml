---
- name: "Netfilter | Install | Ensure module loader is available"
  ansible.builtin.apt:
    name: kmod
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [docker, compose, traffic_mode]

- name: "Netfilter | Runtime | Load and persist the AmneziaWG kernel module"
  community.general.modprobe:
    name: "{{ wg_amnezia_kernel_module }}"
    state: present
    persistent: present
  register: vps_orchestration_amnezia_module
  when: wg_amnezia_enabled | bool
  tags: [docker, compose, traffic_mode]

- name: "Netfilter | Runtime | Fail closed when AmneziaWG was requested but unavailable"
  ansible.builtin.assert:
    that:
      - vps_orchestration_amnezia_module is not failed
    fail_msg: >-
      wg_amnezia_enabled is set but the {{ wg_amnezia_kernel_module }} kernel
      module could not be loaded; install it and retry (see docs/operations.md)
  when: wg_amnezia_enabled | bool
  tags: [docker, compose, traffic_mode]

- name: "Netfilter | Runtime | Load and persist wg-easy legacy iptables modules"
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - iptable_filter
    - ip6table_filter
    - iptable_nat
    - ip6table_nat
    - xt_MASQUERADE
    - xt_comment
    - xt_tcpudp
  tags: [docker, compose, traffic_mode]
