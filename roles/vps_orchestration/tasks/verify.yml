---
- name: "Verify | CA | Wait for Caddy Root CA generation"
  ansible.builtin.wait_for:
    path: "{{ root_ca_path_on_host }}"
    timeout: 90
  tags: [verify]

- name: "Verify | CA | Fetch Root CA certificate"
  ansible.builtin.fetch:
    src: "{{ root_ca_path_on_host }}"
    dest: "{{ fetched_certs_dir }}/{{ inventory_hostname }}/root.crt"
    flat: yes
  tags: [verify]

- name: "Verify | UI | Wait for wg-easy bootstrap UI"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ wg_easy_bootstrap_ui_port }}/"
    status_code: [200, 302]
  register: vps_orchestration_wg_easy_ui
  retries: 12
  delay: 5
  until: vps_orchestration_wg_easy_ui.status in [200, 302]
  tags: [verify]

- name: "Verify | WG | Wait for the WireGuard interface in wg-easy"
  ansible.builtin.command: docker exec wg-easy wg show
  register: vps_orchestration_wg_show
  changed_when: false
  retries: 18
  delay: 5
  until: vps_orchestration_wg_show.rc == 0
  tags: [verify]

- name: "Verify | WG | Confirm wg-easy admin API enforces authentication"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ wg_easy_bootstrap_ui_port }}/api/session"
    status_code: 401
  register: vps_orchestration_wg_easy_session
  retries: 12
  delay: 5
  until: vps_orchestration_wg_easy_session.status == 401
  tags: [verify]

- name: "Verify | Containers | Require running state"
  ansible.builtin.command: docker inspect --format "{{ '{{ .State.Status }}' }}" {{ item }}
  loop:
    - wg-easy
    - adguard
    - caddy
  register: vps_orchestration_container_status
  changed_when: false
  failed_when: vps_orchestration_container_status.stdout != 'running'
  tags: [verify]

- name: "Verify | Containers | Inspect optional health status"
  ansible.builtin.command: >-
    docker inspect
    --format "{{ '{{ if .State.Health }}{{ .State.Health.Status }}{{ else }}none{{ end }}' }}"
    {{ item }}
  loop:
    - wg-easy
    - adguard
    - caddy
  register: vps_orchestration_container_health
  changed_when: false
  retries: 18
  delay: 5
  until: >-
    (item == 'wg-easy' and vps_orchestration_container_health.stdout in ['none', 'healthy'])
    or (item != 'wg-easy' and vps_orchestration_container_health.stdout == 'healthy')
  tags: [verify]

- name: "Verify | WG | wg-easy container env is free of INIT_PASSWORD"
  ansible.builtin.command: docker inspect wg-easy --format "{{ '{{ .Config.Env }}' }}"
  register: vps_orchestration_wg_env_check
  changed_when: false
  failed_when: "'INIT_PASSWORD' in vps_orchestration_wg_env_check.stdout"
  no_log: true
  tags: [verify]

- name: "Verify | WG | wg-easy panel is bound to localhost only"
  ansible.builtin.command: docker port wg-easy
  register: vps_orchestration_wg_ports
  changed_when: false
  # Fail when any 51821/tcp mapping is published on anything other than
  # 127.0.0.1 (a specific public IP bind would otherwise evade a 0.0.0.0 check).
  failed_when: >-
    (vps_orchestration_wg_ports.stdout_lines
      | select('search', '51821/tcp')
      | map('regex_replace', '.*-> ([^:]+):51821', '\\1') | list)
      | difference(['127.0.0.1']) | length > 0
  tags: [verify]

- name: "Verify | UI | Wait for AdGuard UI"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ adguard_bootstrap_ui_port }}/"
    status_code: 200
  register: vps_orchestration_adguard_status
  retries: 12
  delay: 5
  until: vps_orchestration_adguard_status.status == 200
  tags: [verify]

- name: "Verify | SSH | Confirm SSH still accessible"
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ ssh_port }}"
    timeout: 30
  delegate_to: localhost
  when: ansible_connection != "local"
  tags: [verify]

- name: "Verify | Security | Confirm 443 is closed externally"
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 443
    state: stopped
    timeout: 5
  delegate_to: localhost
  when: ansible_connection != "local"
  tags: [verify]

- name: "Verify | Summary | Print completion message"
  ansible.builtin.debug:
    msg:
      - "✅ VPS Nook deployment complete!"
      - "📄 Root CA: {{ fetched_certs_dir }}/{{ inventory_hostname }}/root.crt"
      - "🔗 WireGuard panel: https://{{ wg_internal_domain }} (or http://127.0.0.1:{{ wg_easy_bootstrap_ui_port }} over an SSH tunnel)"
      - "🔗 AdGuard panel: https://{{ adguard_internal_domain }}"
      - "🔑 Log in to the WireGuard panel with the password entered during installation"
      - "📖 Import the Root CA into your browser/OS to trust .internal certificates"
  tags: [verify]
