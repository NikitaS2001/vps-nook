---
- name: "Compose | Caddy | Prepare, validate, and activate managed config"
  tags: [compose]
  block:
    - name: "Compose | Caddy | Create managed candidate beside live file"
      ansible.builtin.tempfile:
        path: "{{ project_root }}"
        prefix: .Caddyfile.candidate.
        state: file
      register: vps_orchestration_caddy_candidate
      changed_when: false

    - name: "Compose | Caddy | Render managed candidate"
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: "{{ vps_orchestration_caddy_candidate.path }}"
        mode: '0600'
      changed_when: false

    - name: "Compose | Caddy | Inspect managed candidate"
      ansible.builtin.stat:
        path: "{{ vps_orchestration_caddy_candidate.path }}"
        checksum_algorithm: sha256
      register: vps_orchestration_caddy_candidate_stat

    - name: "Compose | Caddy | Inspect live managed file"
      ansible.builtin.stat:
        path: "{{ project_root }}/Caddyfile"
        checksum_algorithm: sha256
      register: vps_orchestration_caddy_live

    - name: "Compose | Caddy | Create private validation tree"
      ansible.builtin.tempfile:
        path: "{{ project_root }}"
        prefix: .caddy-validate.
        state: directory
      register: vps_orchestration_caddy_validation_tree
      changed_when: false

    - name: "Compose | Caddy | Create private extension directory"
      ansible.builtin.file:
        path: "{{ vps_orchestration_caddy_validation_tree.path }}/Caddyfile.d"
        state: directory
        mode: '0700'
      changed_when: false

    - name: "Compose | Caddy | Inspect user extension directory"
      ansible.builtin.stat:
        path: "{{ project_root }}/Caddyfile.d"
      register: vps_orchestration_caddy_extensions

    - name: "Compose | Caddy | Copy user extensions into validation tree"
      ansible.builtin.copy:
        src: "{{ project_root }}/Caddyfile.d/"
        dest: "{{ vps_orchestration_caddy_validation_tree.path }}/Caddyfile.d/"
        remote_src: true
        mode: preserve
      changed_when: false
      when: vps_orchestration_caddy_extensions.stat.isdir | default(false)

    - name: "Compose | Caddy | Copy managed candidate into validation tree"
      ansible.builtin.copy:
        src: "{{ vps_orchestration_caddy_candidate.path }}"
        dest: "{{ vps_orchestration_caddy_validation_tree.path }}/Caddyfile"
        remote_src: true
        mode: '0600'
      changed_when: false

    - name: "Compose | Caddy | Hash complete candidate tree"
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import hashlib
            import pathlib
            import sys

            root = pathlib.Path(sys.argv[1])
            digest = hashlib.sha256()
            for path in sorted(item for item in root.rglob("*") if item.is_file()):
                digest.update(path.relative_to(root).as_posix().encode())
                digest.update(b"\0")
                digest.update(path.read_bytes())
                digest.update(b"\0")
            print(digest.hexdigest())
          - "{{ vps_orchestration_caddy_validation_tree.path }}"
      register: vps_orchestration_caddy_candidate_tree_hash
      changed_when: false

    - name: "Compose | Caddy | Inspect validation image"
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - --format
          - "{{ '{{ .Id }}' }}"
          - caddy:{{ caddy_version }}@{{ caddy_image_digest }}
      register: vps_orchestration_caddy_validation_image
      changed_when: false
      failed_when: false

    - name: "Compose | Caddy | Pull missing validation image"
      ansible.builtin.command:
        argv:
          - timeout
          - --signal=TERM
          - 5m
          - docker
          - pull
          - caddy:{{ caddy_version }}@{{ caddy_image_digest }}
      changed_when: true
      no_log: true
      when: vps_orchestration_caddy_validation_image.rc != 0

    - name: "Compose | Caddy | Validate complete candidate tree"
      ansible.builtin.command:
        argv:
          - timeout
          - --signal=TERM
          - 30s
          - docker
          - run
          - --rm
          - --network
          - none
          - --volume
          - "{{ vps_orchestration_caddy_validation_tree.path }}:/etc/caddy:ro"
          - caddy:{{ caddy_version }}@{{ caddy_image_digest }}
          - caddy
          - validate
          - --config
          - /etc/caddy/Caddyfile
          - --adapter
          - caddyfile
      register: vps_orchestration_caddy_validation
      changed_when: false
      failed_when: false
      no_log: true

    - name: "Compose | Caddy | Preserve redacted validation failure"
      ansible.builtin.set_fact:
        vps_orchestration_caddy_primary_task: "Compose | Caddy | Validate complete candidate tree"
        vps_orchestration_caddy_primary_rc: "{{ vps_orchestration_caddy_validation.rc }}"
      when: vps_orchestration_caddy_validation.rc != 0
      no_log: true

    - name: "Compose | Caddy | Reject invalid candidate"
      ansible.builtin.fail:
        msg: "Caddy candidate validation failed; active configuration was not changed"
      when: vps_orchestration_caddy_validation.rc != 0

    - name: "Compose | Caddy | Read active tree hash"
      ansible.builtin.command:
        argv:
          - cat
          - "{{ project_root }}/.Caddyfile.active.sha256"
      register: vps_orchestration_caddy_active_tree_hash
      changed_when: false
      failed_when: false

    - name: "Compose | Caddy | Record whether activation is required"
      ansible.builtin.set_fact:
        vps_orchestration_caddy_activation_required: >-
          {{ not vps_orchestration_caddy_live.stat.exists
             or vps_orchestration_caddy_live.stat.checksum
                != vps_orchestration_caddy_candidate_stat.stat.checksum
             or vps_orchestration_caddy_live.stat.mode != '0600'
             or vps_orchestration_caddy_active_tree_hash.rc != 0
             or vps_orchestration_caddy_active_tree_hash.stdout
                != vps_orchestration_caddy_candidate_tree_hash.stdout }}

    - name: "Compose | Caddy | Detect running Caddy"
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{ .State.Running }}' }}"
          - caddy
      register: vps_orchestration_caddy_running
      changed_when: false
      failed_when: false

    - name: "Compose | Caddy | Activate validated managed config"
      when: vps_orchestration_caddy_activation_required | bool
      block:
        - name: "Compose | Caddy | Create prior-file placeholder"
          ansible.builtin.tempfile:
            path: "{{ project_root }}"
            prefix: .Caddyfile.previous.
            state: file
          register: vps_orchestration_caddy_previous
          when: vps_orchestration_caddy_live.stat.exists

        - name: "Compose | Caddy | Preserve prior managed file"
          ansible.builtin.copy:
            src: "{{ project_root }}/Caddyfile"
            dest: "{{ vps_orchestration_caddy_previous.path }}"
            remote_src: true
            mode: '0600'
          when: vps_orchestration_caddy_live.stat.exists

        # The live Caddyfile is a Docker *file* bind-mount. `mv` replaces the
        # inode, so a running Caddy keeps serving the old fd while
        # `.Caddyfile.active.sha256` tracks the new path. Truncate-and-write
        # keeps the mounted inode; first install (no live file) still creates it.
        - name: "Compose | Activate | Install validated Caddyfile in place"
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import os
                import sys

                source, destination = sys.argv[1], sys.argv[2]
                with open(source, "rb") as handle:
                    data = handle.read()
                fd = os.open(
                    destination,
                    os.O_WRONLY | os.O_CREAT | os.O_TRUNC,
                    0o600,
                )
                try:
                    view = memoryview(data)
                    while view:
                        written = os.write(fd, view)
                        view = view[written:]
                    os.fsync(fd)
                finally:
                    os.close(fd)
                os.chmod(destination, 0o600)
              - "{{ vps_orchestration_caddy_candidate.path }}"
              - "{{ project_root }}/Caddyfile"

        - name: "Compose | Activate | Reload running Caddy"
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - caddy
              - caddy
              - reload
              - --config
              - /etc/caddy/Caddyfile
              - --adapter
              - caddyfile
          when:
            - vps_orchestration_caddy_running.rc == 0
            - vps_orchestration_caddy_running.stdout == 'true'

        - name: "Compose | Activate | Record active tree hash"
          ansible.builtin.copy:
            content: "{{ vps_orchestration_caddy_candidate_tree_hash.stdout }}\n"
            dest: "{{ project_root }}/.Caddyfile.active.sha256"
            mode: '0600'

      rescue:
        - name: "Compose | Rollback | Preserve redacted activation failure"
          ansible.builtin.set_fact:
            vps_orchestration_caddy_primary_task: "{{ ansible_failed_task.name }}"
            vps_orchestration_caddy_primary_rc: "{{ ansible_failed_result.rc | default('unavailable') }}"
          no_log: true

        - name: "Compose | Rollback | Restore prior managed file in place"
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import os
                import sys

                source, destination = sys.argv[1], sys.argv[2]
                with open(source, "rb") as handle:
                    data = handle.read()
                fd = os.open(
                    destination,
                    os.O_WRONLY | os.O_CREAT | os.O_TRUNC,
                    0o600,
                )
                try:
                    view = memoryview(data)
                    while view:
                        written = os.write(fd, view)
                        view = view[written:]
                    os.fsync(fd)
                finally:
                    os.close(fd)
                os.chmod(destination, 0o600)
              - "{{ vps_orchestration_caddy_previous.path }}"
              - "{{ project_root }}/Caddyfile"
          when: vps_orchestration_caddy_live.stat.exists

        - name: "Compose | Rollback | Remove failed first-install file"
          ansible.builtin.file:
            path: "{{ project_root }}/Caddyfile"
            state: absent
          when: not vps_orchestration_caddy_live.stat.exists

        - name: "Compose | Rollback | Reload prior active config"
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - caddy
              - caddy
              - reload
              - --config
              - /etc/caddy/Caddyfile
              - --adapter
              - caddyfile
          when:
            - vps_orchestration_caddy_live.stat.exists
            - vps_orchestration_caddy_running.rc == 0
            - vps_orchestration_caddy_running.stdout == 'true'

        - name: "Compose | Rollback | Report activation failure"
          ansible.builtin.fail:
            msg: "Caddy reload failed; prior managed and active configuration were restored"

  always:
    - name: "Compose | Caddy | Remove managed candidate"
      ansible.builtin.file:
        path: "{{ vps_orchestration_caddy_candidate.path }}"
        state: absent
      changed_when: false
      when: vps_orchestration_caddy_candidate.path is defined

    - name: "Compose | Caddy | Remove private validation tree"
      ansible.builtin.file:
        path: "{{ vps_orchestration_caddy_validation_tree.path }}"
        state: absent
      changed_when: false
      when: vps_orchestration_caddy_validation_tree.path is defined

    - name: "Compose | Caddy | Remove prior-file placeholder"
      ansible.builtin.file:
        path: "{{ vps_orchestration_caddy_previous.path }}"
        state: absent
      when: vps_orchestration_caddy_previous.path is defined
