---
- name: "Compose | Run | Start Docker Compose stack"
  community.docker.docker_compose_v2:
    project_src: "{{ project_root }}"
    state: present
    recreate: "{{ vps_orchestration_compose_recreate | default('auto') }}"
  no_log: "{{ vps_orchestration_wg_easy_bootstrap_required | bool }}"
  tags: [compose]

- name: "Compose | Bootstrap | Complete durable wg-easy setup"
  tags: [compose]
  block:
    - name: "Compose | Bootstrap | Authenticate initial wg-easy setup"
      ansible.builtin.uri:
        # wg-easy 15.4 moved password login from POST /api/session to POST /api/auth/password
        url: "http://127.0.0.1:{{ wg_easy_bootstrap_ui_port }}/api/auth/password"
        method: POST
        body_format: json
        body:
          username: "{{ wg_easy_admin_user }}"
          password: "{{ wg_easy_bootstrap_secret }}"
          remember: false
        return_content: true
        status_code: 200
      register: vps_orchestration_wg_easy_initial_login
      retries: 18
      delay: 5
      until:
        - vps_orchestration_wg_easy_initial_login.status == 200
        - vps_orchestration_wg_easy_initial_login.json.status == 'success'
      no_log: true
      when: vps_orchestration_wg_easy_bootstrap_required | bool

    - name: "Compose | Re-secure | Render Compose without INIT variables"
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ project_root }}/docker-compose.yml"
        backup: no
        mode: '0644'
      vars:
        wg_easy_include_init: false
      no_log: true
      when: vps_orchestration_wg_easy_bootstrap_required | bool

    - name: "Compose | Re-secure | Recreate containers without INIT variables"
      community.docker.docker_compose_v2:
        project_src: "{{ project_root }}"
        state: present
        recreate: always
        services: [wg-easy]
        dependencies: false
      no_log: true
      when: vps_orchestration_wg_easy_bootstrap_required | bool

    - name: "Compose | Bootstrap | Authenticate re-secured wg-easy setup"
      ansible.builtin.uri:
        # wg-easy 15.4 moved password login from POST /api/session to POST /api/auth/password
        url: "http://127.0.0.1:{{ wg_easy_bootstrap_ui_port }}/api/auth/password"
        method: POST
        body_format: json
        body:
          username: "{{ wg_easy_admin_user }}"
          password: "{{ wg_easy_bootstrap_secret }}"
          remember: false
        return_content: true
        status_code: 200
      register: vps_orchestration_wg_easy_resecured_login
      retries: 18
      delay: 5
      until:
        - vps_orchestration_wg_easy_resecured_login.status == 200
        - vps_orchestration_wg_easy_resecured_login.json.status == 'success'
      no_log: true
      when: vps_orchestration_wg_easy_bootstrap_required | bool

  rescue:
    - name: "Compose | Bootstrap | Preserve redacted bootstrap failure"
      ansible.builtin.set_fact:
        vps_orchestration_compose_bootstrap_task: "{{ ansible_failed_task.name }}"
        vps_orchestration_compose_bootstrap_rc: "{{ ansible_failed_result.rc | default('unavailable') }}"
      no_log: true

    - name: "Compose | Bootstrap | Propagate failure to credential transaction"
      ansible.builtin.fail:
        msg: "wg-easy bootstrap failed; enclosing Compose transaction must scrub credentials"

  always:
    - name: "Compose | Cleanup | Find legacy Compose backups"
      ansible.builtin.find:
        paths: "{{ project_root }}"
        patterns: "docker-compose.yml.bak*"
        file_type: file
      register: vps_orchestration_legacy_baks

    - name: "Compose | Cleanup | Delete legacy Compose backups"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ vps_orchestration_legacy_baks.files }}"
      no_log: true
