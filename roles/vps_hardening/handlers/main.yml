---
- name: Restart ssh
  ansible.builtin.service:
    name: "{{ ssh_service_name }}"
    state: restarted
  listen: restart sshd
  when: not (vps_hardening_ssh_rollback | default(false) | bool)

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  listen: reload sysctl

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  listen: restart fail2ban
