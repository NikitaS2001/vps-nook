---
- name: "SSH | Preflight | Ensure privilege separation directory"
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: [ssh]

- name: "SSH | Snapshot | Read original effective configuration"
  ansible.builtin.command: /usr/sbin/sshd -T
  register: vps_hardening_original_sshd
  changed_when: false
  tags: [ssh]

- name: "SSH | Snapshot | Read original listeners"
  ansible.builtin.command: ss -H -ltnp
  register: vps_hardening_original_listeners
  changed_when: false
  tags: [ssh]

- name: "SSH | Snapshot | Read service and socket state"
  ansible.builtin.service_facts:
  tags: [ssh]

- name: "SSH | Snapshot | Read socket unit properties"
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "{{ ssh_socket_name }}"
      - --property=LoadState
      - --property=ActiveState
      - --property=UnitFileState
      - --property=Listen
  register: vps_hardening_original_socket_properties
  changed_when: false
  tags: [ssh]

- name: "SSH | Snapshot | Preserve recovery state"
  ansible.builtin.set_fact:
    vps_hardening_original_ssh_service: "{{ ansible_facts.services[ssh_service_name ~ '.service'] }}"
    vps_hardening_original_ssh_socket: >-
      {{ {'state': ('running' if 'ActiveState=active' in vps_hardening_original_socket_properties.stdout_lines else 'stopped'),
          'status': ('enabled' if 'UnitFileState=enabled' in vps_hardening_original_socket_properties.stdout_lines else 'disabled')}
         if 'LoadState=loaded' in vps_hardening_original_socket_properties.stdout_lines else {} }}
    vps_hardening_original_ssh_ports: >-
      {{ ((vps_hardening_original_listeners.stdout_lines | select('search', 'sshd')
             | map('regex_replace', '[ \t]+', ' ') | map('trim') | map('split') | map(attribute=3) | map('regex_replace', '^.*:', '')
             | select('match', '^[0-9]+$') | list)
          or ((vps_hardening_original_socket_properties.stdout | default('')
               | regex_findall('[: ]([0-9]+) [(]Stream[)]'))
              if 'ActiveState=active' in vps_hardening_original_socket_properties.stdout_lines else [])
          or (vps_hardening_original_sshd.stdout_lines | select('match', '^port [0-9]+$')
              | map('regex_replace', '^port ', '') | list)) | unique | list }}
    vps_hardening_ssh_activation_started: false
    vps_hardening_ssh_rollback: false
  tags: [ssh]

- name: "SSH | Snapshot | Require original recovery ports"
  ansible.builtin.assert:
    that:
      - vps_hardening_original_ssh_ports | length > 0
    fail_msg: "Cannot establish original SSH ports; refusing cutover."
  tags: [ssh]

- name: "SSH | Config | Apply and verify hardened sshd_config"
  block:
    - name: "SSH | Config | Apply hardened sshd_config"
      ansible.builtin.template:
        src: sshd_config.j2
        dest: /etc/ssh/sshd_config
        validate: '/usr/sbin/sshd -t -f %s'
        backup: yes
        mode: '0644'
      register: vps_hardening_sshd_config
      notify: restart sshd
      tags: [ssh]

    - name: "SSH | Config | Mark activation boundary"
      ansible.builtin.set_fact:
        vps_hardening_ssh_activation_started: true
      tags: [ssh]

    # Stop the socket-owned listener while systemd still owns its MainPID.
    # Disabling the socket first can leave that listener outside service tracking.
    # KillMode=process on supported platforms preserves established sessions.
    - name: "SSH | Socket | Stop service before disabling active socket"
      ansible.builtin.systemd_service:
        name: "{{ ssh_service_name }}"
        state: stopped
      when:
        - vps_hardening_manage_ssh_socket | bool
        - vps_hardening_original_ssh_socket.state | default('stopped') == 'running'
      tags: [ssh]

    - name: "SSH | Socket | Disable socket activation for hardened sshd_config"
      ansible.builtin.service:
        name: "{{ ssh_socket_name }}"
        state: stopped
        enabled: no
      when:
        - vps_hardening_manage_ssh_socket | bool
        - vps_hardening_original_ssh_socket | length > 0
      notify: restart sshd
      tags: [ssh]

    - name: "SSH | Service | Enable sshd service for boot"
      ansible.builtin.service:
        name: "{{ ssh_service_name }}"
        state: started
        enabled: yes
      when:
        - vps_hardening_manage_ssh_socket | bool
        - vps_hardening_original_ssh_socket | length > 0
      notify: restart sshd
      tags: [ssh]

    - name: "SSH | Flush | Force handler execution now"
      ansible.builtin.meta: flush_handlers
      tags: [ssh]

    - name: "SSH | Verify | Wait for local sshd on new port"
      ansible.builtin.wait_for:
        port: "{{ ssh_port }}"
        host: 127.0.0.1
        timeout: 30
      when: ansible_connection == "local"
      tags: [ssh]

    - name: "SSH | Verify | Wait for sshd on new port"
      ansible.builtin.wait_for:
        port: "{{ vps_hardening_controller_ssh_port }}"
        host: "{{ hostvars[inventory_hostname].ansible_host }}"
        timeout: 30
      delegate_to: localhost
      become: false
      when: (hostvars[inventory_hostname].ansible_connection | default("ssh")) != "local"
      tags: [ssh]

    - name: "SSH | Verify | Authenticate admin on new port"
      ansible.builtin.wait_for_connection:
        timeout: 30
        connect_timeout: 5
        sleep: 1
      vars:
        ansible_port: "{{ vps_hardening_controller_ssh_port }}"
        ansible_user: "{{ admin_user }}"
      when: (hostvars[inventory_hostname].ansible_connection | default("ssh")) != "local"
      tags: [ssh]
  rescue:
    - name: "SSH | Rescue | Suppress queued cutover restart"
      ansible.builtin.set_fact:
        vps_hardening_ssh_rollback: true
      tags: [ssh]

    - name: "SSH | Rescue | Restore previous sshd_config"
      ansible.builtin.copy:
        src: "{{ vps_hardening_sshd_config.backup_file }}"
        dest: /etc/ssh/sshd_config
        remote_src: true
        validate: '/usr/sbin/sshd -t -f %s'
        mode: '0644'
      when: vps_hardening_sshd_config.backup_file is defined
      tags: [ssh]

    - name: "SSH | Rescue | Drain queued handlers without activating failed candidate"
      ansible.builtin.meta: flush_handlers
      tags: [ssh]

    - name: "SSH | Rescue | Release listeners before restoring active socket"
      ansible.builtin.systemd_service:
        name: "{{ ssh_service_name }}"
        state: stopped
      when:
        - vps_hardening_ssh_activation_started | bool
        - vps_hardening_manage_ssh_socket | bool
        - vps_hardening_original_ssh_socket.state | default('stopped') == 'running'
      tags: [ssh]

    - name: "SSH | Rescue | Restore socket activation"
      ansible.builtin.systemd_service:
        name: "{{ ssh_socket_name }}"
        daemon_reload: true
        state: "{{ 'started' if vps_hardening_original_ssh_socket.state == 'running' else 'stopped' }}"
        enabled: "{{ vps_hardening_original_ssh_socket.status == 'enabled' }}"
      when:
        - vps_hardening_ssh_activation_started | bool
        - vps_hardening_manage_ssh_socket | bool
        - vps_hardening_original_ssh_socket | length > 0
      tags: [ssh]

    - name: "SSH | Rescue | Restore service state"
      ansible.builtin.systemd_service:
        name: "{{ ssh_service_name }}"
        state: >-
          {{ ('started' if (vps_hardening_manage_ssh_socket
                            and vps_hardening_original_ssh_socket.state | default('stopped') == 'running')
              else 'restarted') if vps_hardening_original_ssh_service.state == 'running' else 'stopped' }}
        enabled: "{{ vps_hardening_original_ssh_service.status == 'enabled' }}"
      when: vps_hardening_ssh_activation_started | bool
      tags: [ssh]

    - name: "SSH | Rescue | Check original local listeners"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item | int }}"
        state: started
        timeout: 10
      loop: "{{ vps_hardening_original_ssh_ports }}"
      when: vps_hardening_ssh_activation_started | bool
      tags: [ssh]

    - name: "SSH | Rescue | Authenticate through original remote path"
      ansible.builtin.wait_for_connection:
        timeout: 30
        connect_timeout: 5
        sleep: 1
      when:
        - vps_hardening_ssh_activation_started | bool
        - ansible_connection | default('ssh') != 'local'
      tags: [ssh]

    - name: "SSH | Rescue | Report failed cutover"
      ansible.builtin.fail:
        msg: >-
          {{ 'SSH activation failed; previous configuration and service state were restored and listeners checked.'
             if vps_hardening_ssh_activation_started
             else 'SSH candidate validation failed before activation; the existing SSH service was not restarted.' }}
          The old firewall allowance was retained. Verify remote access before disconnecting.
      tags: [ssh]

# Cutover succeeded: drop the temporary allow rule for the old connection
# port that ufw.yml added, so the firewall converges instead of keeping an
# orphaned open port. On rollback (the rescue above) this task is skipped and
# the old-port rule stays, preserving access.
- name: "SSH | Cleanup | Remove temporary old-port UFW allow after cutover"
  community.general.ufw:
    rule: allow
    port: "{{ ansible_port | int }}"
    proto: tcp
    delete: yes
  when:
    - ansible_connection | default("") != "local"
    - ansible_port is defined
    - (ansible_port | int) != (ssh_port | int)
  tags: [ssh, ssh_ufw_cleanup]

- name: "SSH | Update | Set ansible connection for remainder"  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    ansible_port: "{{ vps_hardening_controller_ssh_port }}"
    ansible_user: "{{ admin_user }}"
  when: ansible_connection != "local"
  tags: [ssh]
