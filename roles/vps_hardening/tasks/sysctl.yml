---
- name: "VPS Hardening | Sysctl | Apply kernel hardening settings"
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/99-vps-nook.conf
    backup: yes
    mode: '0644'
  when: ansible_facts['virtualization_type'] not in ['lxc', 'openvz']
  notify: reload sysctl
  tags: [sysctl]

- name: "VPS Hardening | Sysctl | Apply sysctl immediately"
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-vps-nook.conf
  register: vps_hardening_sysctl_apply
  when: ansible_facts['virtualization_type'] not in ['lxc', 'openvz']
  changed_when: false
  tags: [sysctl]
