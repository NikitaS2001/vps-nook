---
# Example: run Vaultwarden behind an internal domain.
#
# Pin a release tag from https://github.com/dani-garcia/vaultwarden/releases
# (this example uses 1.37.1). Do not substitute :latest.
#
# DOMAIN is the public HTTPS name clients use (the Caddy site), not the
# container hostname. See https://github.com/dani-garcia/vaultwarden/wiki/Configuration-overview
# SIGNUPS_ALLOWED is "true" so you can create the first account; set it to
# "false" afterwards — any VPN peer can register while signup is open.
#
# If internal_domain_suffix is not "internal", change the hostname (vw.<suffix>)
# in this file and in the Caddy site block. Keep the files named
# examples/vaultwarden-*.
#
# 1. mkdir -p /opt/vps-nook/volumes/vaultwarden /opt/vps-nook/Caddyfile.d
# 2. Copy this file to /opt/vps-nook/docker-compose.override.yml
#    (the role never rewrites it, so it survives playbook re-runs).
#    Copy examples/vaultwarden.caddy.conf to
#    /opt/vps-nook/Caddyfile.d/vaultwarden.conf (substitute your suffix).
# 3. Start only the new service:
#      cd /opt/vps-nook && sudo docker compose up -d vaultwarden
# 4. Re-run the public installer, or the remote ansible-playbook command, so
#    Caddy validates and reloads the site. Do not restart Caddy directly.
# 5. Open https://vw.<suffix> after importing root.crt (default: https://vw.internal).
#
# Browsers work after importing root.crt. Mobile Bitwarden apps often reject
# Caddy's private CA (no public OCSP/chain).
#
# Keep the service and its volumes under /opt/vps-nook so the project
# backup (scripts/backup.sh) captures it together with the base stack.
services:
  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      vpn_net: {}
    volumes:
      - ./volumes/vaultwarden:/data
    environment:
      DOMAIN: "https://vw.internal"
      SIGNUPS_ALLOWED: "true"
