---
# Operator-owned recipe: see examples/vaultwarden/README.md.
# Merge services.vaultwarden into the single installed Compose override.
services:
  vaultwarden:
    image: vaultwarden/server:1.37.1@sha256:ebdfe70701c60ac0c28c697e787cea767d7972940b786037b29fe0d507f821e8
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      vpn_net: {}
    volumes:
      - ./volumes/vaultwarden:/data
    environment:
      DOMAIN: "https://vw.internal"
      SIGNUPS_ALLOWED: "false"
